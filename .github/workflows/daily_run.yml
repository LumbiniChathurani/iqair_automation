
name: Daily IQAir Page Visit

on:
  schedule:
    # Every day at 03:30 UTC (09:00 Sri Lanka time)
    - cron: "30 3 * * *"

  workflow_dispatch:

jobs:
  open-iqair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Run IQAir script
        run: python open_iqair.py
